name: Publish LangChain package

on:
  push:
    tags:
      - "langchain-v*"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/langchain-ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: langchain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "The tag must point to a commit in main's history." >&2
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.21"
      - name: Check the version tag
        run: |
          python - <<'PY'
          import os
          from runpy import run_path

          version = run_path("langchain_aicheckerhumanizer/_version.py")["__version__"]
          expected = f"langchain-v{version}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(f"Expected tag {expected}, got {actual}")
          PY
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: langchain/dist/
